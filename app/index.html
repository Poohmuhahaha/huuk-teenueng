<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Huuk by teenueng — plan, publish and measure client content in one workspace." />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Huuk by teenueng — Content Studio</title>
    <style>
      /* Boot splash: first paint before the JS bundle boots (Vue clears #app on mount). */
      html, body { margin: 0; padding: 0; background: #f6f6f6; }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot-word { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot" aria-hidden="true"><span class="boot-word">Huuk</span></div></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
