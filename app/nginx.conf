# Static host for the built SPA + same-origin proxy to the API container.
#
# Header inheritance: nginx does NOT inherit `add_header` into a location that
# declares its own, so each location repeats the baseline hardening headers.
# The API (Rust) sets its own security headers — /api/ locations add none, so
# they are not duplicated.

# Brute-force protection (per client IP, 10 MB in-memory zones).
# NOTE: behind the optional Caddy TLS profile every request arrives from Caddy,
# so these limits become global; add trusted real-IP handling before scaling.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;
    limit_req_log_level warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # The SPA shell must never be cached (it references hashed bundles).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Same-origin app: no inline scripts (Vite emits external modules);
        # inline styles are allowed for Vue `style="..."` bindings.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Other static files (favicon, robots…) served straight from root.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }

    # Login/register get a tighter limit than the rest of the API.
    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        include /etc/nginx/cp-api-proxy.inc;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        include /etc/nginx/cp-api-proxy.inc;
    }

    # API proxy (same origin, so the browser never needs CORS).
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        include /etc/nginx/cp-api-proxy.inc;
    }
}
