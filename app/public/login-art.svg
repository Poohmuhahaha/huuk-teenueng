<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a30"/>
      <stop offset=".30" stop-color="#3b1c66"/>
      <stop offset=".52" stop-color="#8a357c"/>
      <stop offset=".66" stop-color="#d9678a"/>
      <stop offset=".76" stop-color="#f6a58c"/>
      <stop offset=".81" stop-color="#4a1c4e"/>
      <stop offset="1" stop-color="#170a2b"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffcfae" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#ff8fae" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff7fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffe4cd" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#f59bb3" stop-opacity=".38"/>
      <stop offset="1" stop-color="#301144" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0518" stop-opacity="0"/>
      <stop offset=".55" stop-color="#0b0518" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0b0518" stop-opacity=".92"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#sky)"/>

  <g fill="#fff">
    <circle cx="118" cy="168" r="1.6" opacity=".65"/>
    <circle cx="212" cy="96" r="1.1" opacity=".45"/>
    <circle cx="328" cy="208" r="1.4" opacity=".55"/>
    <circle cx="612" cy="128" r="1.2" opacity=".5"/>
    <circle cx="736" cy="222" r="1.7" opacity=".6"/>
    <circle cx="812" cy="94" r="1" opacity=".4"/>
    <circle cx="486" cy="72" r="1.3" opacity=".5"/>
  </g>

  <circle cx="450" cy="720" r="430" fill="url(#sun)"/>

  <g filter="url(#soft)">
    <ellipse cx="300" cy="688" rx="260" ry="46" fill="#ffd7c1" opacity=".22"/>
    <ellipse cx="648" cy="756" rx="230" ry="38" fill="#ff9fbd" opacity=".2"/>
    <ellipse cx="450" cy="826" rx="380" ry="58" fill="#2a0f3d" opacity=".35"/>
  </g>

  <path d="M450 260 L830 880 L70 880 Z" fill="url(#peak)"/>
  <path d="M450 260 L830 880" stroke="#ffe6d2" stroke-opacity=".45" stroke-width="2"/>
  <path d="M450 260 L70 880" stroke="#ffc9c4" stroke-opacity=".26" stroke-width="2"/>
  <path d="M450 470 L660 880 L240 880 Z" fill="#1c0a2e" opacity=".3"/>

  <g filter="url(#soft2)">
    <rect x="70" y="884" width="760" height="14" fill="#ffd9c3" opacity=".2"/>
    <ellipse cx="260" cy="910" rx="220" ry="26" fill="#ffc7c0" opacity=".12"/>
    <ellipse cx="690" cy="930" rx="240" ry="30" fill="#ffd4c6" opacity=".1"/>
  </g>

  <path d="M0 952 C 150 902 260 942 380 932 C 520 920 650 882 900 932 V1200 H0 Z" fill="#1c0b2e" opacity=".9"/>
  <path d="M0 1042 C 180 992 330 1052 470 1022 C 640 986 760 1012 900 992 V1200 H0 Z" fill="#120620"/>

  <rect y="640" width="900" height="560" fill="url(#veil)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity=".55"/>
</svg>
