# Production Docker Compose topology (Master Engineering SOP §3.3 & §5.5)
# Caddy 2 reverse proxy + one-off Migration job + Rust Axum API + PostgreSQL 16
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-huuk_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huuk} -d ${POSTGRES_DB:-huuk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  migration:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/server", "--run-migrations-only"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-huuk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huuk_db}
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      PORT: "8787"
      BIND_ADDR: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-huuk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huuk_db}
      DATA_FILE: /app/data/content-planner.json
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      DEMO_MODE: ${DEMO_MODE:-0}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      - api-data:/app/data
    expose:
      - "8787"
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_UPSTREAM: api:8787
      FRONTEND_ROOT: /srv/dist
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app/dist:/srv/dist:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pg-data:
  api-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
