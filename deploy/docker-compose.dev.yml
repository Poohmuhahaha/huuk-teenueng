# Local development PostgreSQL stack (Master Engineering SOP §1.3 / §4.1)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huuk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-huuk_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huuk} -d ${POSTGRES_DB:-huuk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-dev-data:
