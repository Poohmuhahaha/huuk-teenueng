[package]
name = "content-planner-server"
version = "0.1.0"
edition = "2021"
description = "REST backend for the Content Planner wireframe app"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
argon2 = "0.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
# Encrypts provider tokens at rest in the snapshot (see `secrets.rs`).
chacha20poly1305 = "0.10"
# Session tokens are persisted as hashes (see store::session_key).
blake2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
