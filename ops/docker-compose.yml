# Production stack: Caddy 2 reverse proxy + one-off Migration job + Rust API + PostgreSQL 16 (Master Engineering SOP §3.3 & §5.5).
#
# Usage (from repo root):
#   cp ops/.env.example ops/.env        # edit secrets & domain
#   docker compose --env-file ops/.env -f ops/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huuk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-huuk_db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huuk} -d ${POSTGRES_DB:-huuk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  migration:
    build:
      context: ../server
      dockerfile: Dockerfile
    command: ["/app/server", "--run-migrations-only"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-huuk}:${POSTGRES_PASSWORD:-huuk_dev_password}@postgres:5432/${POSTGRES_DB:-huuk_db}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      PORT: "8787"
      BIND_ADDR: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-huuk}:${POSTGRES_PASSWORD:-huuk_dev_password}@postgres:5432/${POSTGRES_DB:-huuk_db}
      DATA_FILE: /app/data/content-planner.json
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      DEMO_MODE: ${DEMO_MODE:-1}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@studio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo1234}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      LIVE_REFRESH_MIN: ${LIVE_REFRESH_MIN:-15}
    volumes:
      - api-data:/app/data
    expose:
      - "8787"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80, :8080}
      API_UPSTREAM: api:8787
      FRONTEND_ROOT: /srv/frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "8080:8080"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pg-data:
  api-data:
  caddy-data:
  caddy-config:
