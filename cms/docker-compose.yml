# Huuk docs CMS (Strapi + Postgres) — local/dev stack.
#
#   cd cms && docker compose up --build     # Strapi :1337 + Postgres :5432
#   open http://localhost:1337/admin        # create admin on first boot
#   curl http://localhost:1337/api/doc-pages | head -c 300
#
# Secrets below are LOCAL DEV ONLY. Production must override via cms/.env
# (see .env.example) or a secrets manager.
name: huuk-cms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi-dev-only
      POSTGRES_DB: strapi_docs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi_docs"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  strapi:
    build: .
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi_docs
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi-dev-only
      DATABASE_SSL: "false"
      # DEV-ONLY secrets — override in production (see .env.example).
      APP_KEYS: dev-key-1,dev-key-2,dev-key-3,dev-key-4
      API_TOKEN_SALT: dev-api-token-salt-change-me
      ADMIN_JWT_SECRET: dev-admin-jwt-change-me
      TRANSFER_TOKEN_SALT: dev-transfer-salt-change-me
      JWT_SECRET: dev-jwt-change-me
    volumes:
      - ./:/opt/app
      - /opt/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run develop
    restart: unless-stopped

volumes:
  pgdata:
